/**
 * VISSv3.0 Protocol Buffers Definition
 */

syntax = "proto3";
package yoriito.viss.v1;

/* external proto */
import "google/protobuf/empty.proto";

/* internal proto */
import "yoriito/viss/v1/types/error.proto";
import "yoriito/viss/v1/types/filter.proto";
import "yoriito/viss/v1/types/value.proto";

/**********************************************************
 * Inspect
 **********************************************************/

// InspectRequest represents a request to get metadata of a node
message InspectRequest {
  // The path of the node to inspect
  string path = 1;
  // Optional filter to apply to the inspection
  optional InspectFilter filter = 2;
}

// InspectResponse represents the response to an InspectRequest
message InspectResponse {
  // Timestamp of the server response
  int64 ts = 1;

  // result can be either metadata or an error
  oneof result {
    // metadata contains the metadata of the node
    MetadataEntries metadata = 11;
    // error contains any error that occurred on the server
    Error error = 12;
  }
}

/**********************************************************
 * Subscribe/Subscription
 **********************************************************/

// SubscribeSuccess represents a successful subscription response
message SubscribeSuccess {
  // The ID of the subscription
  string subscription_id = 11;
}

// SubscribeError represents an error response for a subscription request
message SubscribeError {
  // Error contains any error that occurred on the server
  Error error = 21;
}

/**********************************************************
 * Unsubscribe
 **********************************************************/

// UnsubscribeRequest represents a request to unsubscribe from a subscription
message UnsubscribeRequest {
  // The ID of the subscription to unsubscribe from
  string subscription_id = 1;
}

// UnsubscribeResponse represents the response to an UnsubscribeRequest
message UnsubscribeResponse {
  // Timestamp of the server response
  int64 ts = 1;
  // result can be either success or an error
  oneof result {
    // success indicates that the unsubscription was successful
    google.protobuf.Empty success = 11;
    // error contains any error that occurred on the server
    Error error = 12;
  }
}
