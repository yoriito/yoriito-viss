/**
 * VISSv3.0 Protocol Buffers Definition
 */

syntax = "proto3";
package yoriito.viss.v1.producer;

/* external proto */
import "google/protobuf/empty.proto";

/* internal proto */
import "yoriito/viss/v1/types/error.proto";
import "yoriito/viss/v1/types/filter.proto";
import "yoriito/viss/v1/types/value.proto";
import "yoriito/viss/v1/common.proto";

// gRPC Service Definition
service VISS {
  // action to get target value of an actuator
  rpc GetTarget(GetTargetRequest) returns (GetTargetResponse);
  // action to set current value of a sensor
  rpc SetCurrent(SetCurrentRequest) returns (SetCurrentResponse);
  // action to get metadata of a node
  rpc Inspect(InspectRequest) returns (InspectResponse);
  // action to define VSS nodes. See [here](Define_Delete.md).
  rpc Define(DefineRequest) returns (DefineResponse);
  // action to delete VSS nodes. See [here](Define_Delete.md).
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // action to subscribe to target value changes of an actuator
  rpc SubscribeTarget(SubscribeTargetRequest) returns (stream SubscribeTargetResponse);
  // action to unsubscribe from target value changes
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);
}

/**********************************************************
 * Get
 **********************************************************/

// GetTargetRequest represents a request to get target values for actuators
message GetTargetRequest {
  // The path of the node to get target values from
  string path = 1;
  // Optional filter to apply to the data retrieval
  optional GetFilter filter = 2;
}

// GetTargetResponse represents the response to a GetTargetRequest
message GetTargetResponse {
  // Timestamp of the server response
  int64 ts = 1;

  // result can be either data or an error
  oneof result {
    // data contains the target values for the actuators
    DataPackagesTarget data = 11;
    // error contains any error that occurred on the server
    Error error = 12;
  }
}

/**********************************************************
 * Set
 **********************************************************/

// SetCurrentRequest represents a request to set current values for sensors
message SetCurrentRequest {
  // The current data to set for the sensors
  DataPackagesCurrent data = 1;
}

// SetCurrentResponse represents the response to a SetCurrentRequest
message SetCurrentResponse {
  // Timestamp of the server response
  int64 ts = 1;

  // result can be either success or an error
  oneof result {
    // success indicates that the current values were set successfully
    google.protobuf.Empty success = 11;
    // error contains any error that occurred on the server
    Error error = 12;
  }
}

/**********************************************************
 * Subscribe/Subscription
 **********************************************************/

// SubscribeTargetRequest represents a request to subscribe to target value changes of an actuator
message SubscribeTargetRequest {
  // The path of the node to subscribe to
  string path = 1;
  // Optional filter to apply to the subscription
  SubscribeFilter filter = 2;
}

// SubscribeTargetResponse represents the response to a SubscribeTargetRequest
message SubscribeTargetResponse {
  // Timestamp of the server response
  int64 ts = 1;
  // SubscribeTargetResponse can contain either a success, an error, or an event
  oneof message_type {
    // success indicates the subscription was successful
    SubscribeSuccess success = 10;
    // error contains any error that occurred on the server
    SubscribeError error = 20;
    // event contains data updates for the subscription
    SubscriptionTargetEvent event = 30;
  }
}

// SubscribeSuccess represents an event in a subscription
message SubscriptionTargetEvent {
  // The ID of the subscription that this event belongs to
  string subscription_id = 31;
  // The target data for the subscription
  DataPackagesTarget data = 32;
}

/**********************************************************
 * Define : action to define VSS nodes
 * Delete : action to delete VSS nodes
 **********************************************************/

// DefineRequest represents a request to define VSS nodes
message DefineRequest {
  // The set of the path and metada entries to define
  MetadataEntries entries = 1;
}

// DefineResponse represents the response to a DefineRequest
message DefineResponse {
  // Timestamp of the server response
  int64 ts = 1;

  // result can be either success or an error
  oneof result {
    // success indicates that the VSS nodes were defined successfully
    google.protobuf.Empty success = 11;
    // error contains any error that occurred on the server
    Error error = 12;
  }
}

// DeleteRequest represents a request to delete VSS nodes
message DeleteRequest {
  // The path of the node to delete
  // If a node which does not exist is specified, it is ignored.
  repeated string path = 1;
}

// DeleteResponse represents the response to a DeleteRequest
message DeleteResponse {
  // Timestamp of the server response
  int64 ts = 1;

  // result can be either success or an error
  oneof result {
    // success indicates that the VSS nodes were deleted successfully
    google.protobuf.Empty success = 11;
    // error contains any error that occurred on the server
    Error error = 12;
  }
}
